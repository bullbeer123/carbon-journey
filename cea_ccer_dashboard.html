<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .kpi-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .kpi-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .kpi-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .kpi-icon {
            font-size: 1.5em;
        }
        
        .kpi-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .kpi-unit {
            font-size: 0.6em;
            color: #999;
            margin-left: 5px;
        }
        
        .kpi-tooltip {
            cursor: help;
            margin-left: 5px;
            font-size: 0.9em;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        
        .kpi-tooltip:hover {
            opacity: 1;
        }
        
        .kpi-explanation {
            font-size: 0.75em;
            color: #888;
            margin-top: 8px;
            line-height: 1.4;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }
        
        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .chart-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .chart {
            width: 100%;
            height: 400px;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 30px;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .kpi-container {
                grid-template-columns: 1fr;
            }
            
            .grid-2 {
                grid-template-columns: 1fr;
            }
            
            .chart {
                height: 300px;
            }
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }
    </style>

                    show: true,
                    type: 'slider',
                    top: '90%',
                    start: 70,
                    end: 100
                }
            ],
            series: [
                {
                    name: '挂牌成交量',
                    type: 'bar',
                    stack: 'total',
                    data: ceaData.spotVol,
                    itemStyle: {
                        color: '#667eea'
                    }
                },
                {
                    name: '大宗成交量',
                    type: 'bar',
                    stack: 'total',
                    data: ceaData.bulkVol,
                    itemStyle: {
                        color: '#5ad8a6'
                    }
                }
            ]
        };
        volumeChart.setOption(volumeOption);
        
        // 响应式处理
        window.addEventListener('resize', function() {
            ceaChart.resize();
            ccerChart.resize();
            spreadChart.resize();
            volumeChart.resize();
        });
    </script>
