    const catNames = {gov:'政府平台',market:'碳交易',industry:'行业协会',enterprise:'企业SaaS',intl:'国际机制/标准',info:'资讯/数据/智库'};
    let currentCat = 'all';
    let shownCount = 0;
    const PAGE_SIZE = 24;

    function renderCards(resetCount = true) {
        const query = document.getElementById('pfSearchInput').value.toLowerCase().trim();
        const grid = document.getElementById('pfGrid');
        const noResult = document.getElementById('pfNoResult');
        const loadMore = document.getElementById('pfLoadMore');
        const countEl = document.getElementById('pfCount');

        // 筛选
        let filtered = platforms.filter(p => {
            if (currentCat !== 'all' && p.cat !== currentCat) return false;
            if (query) {
                const txt = (p.name + ' ' + p.desc + ' ' + p.tags.join(' ') + ' ' + p.func.join(' ') + ' ' + catNames[p.cat] + ' ' + p.region).toLowerCase();
                if (!txt.includes(query)) return false;
            }
            return true;
        });

        if (resetCount) shownCount = 0;
        shownCount = Math.min(shownCount + PAGE_SIZE, filtered.length);
        if (resetCount && filtered.length > 0) shownCount = Math.min(PAGE_SIZE, filtered.length);
        const toShow = filtered.slice(0, shownCount);

        // 更新计数
        if (query || currentCat !== 'all') {
            countEl.style.display = 'block';
            countEl.textContent = `找到 ${filtered.length} 个平台`;
        } else {
            countEl.style.display = 'none';
        }

        // 无结果
        if (filtered.length === 0) {
            grid.innerHTML = '';
            noResult.style.display = 'block';
            loadMore.style.display = 'none';
            return;
        }
        noResult.style.display = 'none';

        // 渲染卡片
        grid.innerHTML = toShow.map(p => `
            <div class="pf-card">
                <div class="pf-card-top">
                    <div class="pf-card-icon">${p.icon}</div>
                    <div>
                        <div class="pf-card-name">${p.name}</div>
                        <div class="pf-card-cat">${catNames[p.cat] || p.cat}</div>
                    </div>
                </div>
                <div class="pf-card-desc">${p.desc}</div>
                <div class="pf-card-tags">
                    ${p.tags.map(t => `<span class="pf-card-tag">${t}</span>`).join('')}
                    ${p.func.slice(0,2).map(f => `<span class="pf-card-tag func">${f}</span>`).join('')}
                </div>
                <div class="pf-card-bottom">
                    <span class="pf-card-region">📍 ${p.region}</span>
                    <a href="${p.url}" target="_blank" rel="noopener" class="pf-card-visit">
                        访问 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h3M15 3h6v6M10 14L21 3"/></svg>
                    </a>
                </div>
            </div>
        `).join('');

        // 加载更多按钮
        loadMore.style.display = shownCount < filtered.length ? 'flex' : 'none';
    }

    function loadMore() {
        shownCount += PAGE_SIZE;
        renderCards(false);
    }

    // 分类筛选
    document.querySelectorAll('.pf-filter').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.pf-filter').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCat = btn.dataset.cat;
            renderCards();
        });
    });

    // 搜索
    let searchTimer;
    document.getElementById('pfSearchInput').addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => renderCards(), 200);
    });

    // 初始渲染
    renderCards();
    </script>
</body>
</html>
